<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>RevaMan | PTCG Sandbox</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="./css/game.css" />
    <link rel="stylesheet" href="./css/card.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <script type="importmap">
      {
        "imports": {
          "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-container">
      <div id="opp-hand" class="hand">
        <div class="hand-cards"></div>
      </div>

      <div class="gameboard">
        <div id="opp-field" class="field">
          <div id="opp-prizes" class="zone pile prizes"></div>

          <div id="opp-bench" class="zone bench"></div>

          <div class="deck-discard">
            <div id="opp-deck" class="zone pile deck"></div>
            <div id="opp-discard" class="zone pile discard"></div>
          </div>
        </div>

        <div class="mid-field">
          <div class="stadium-lz">
            <div id="lost-zone" class="zone pile lost-zone"></div>
            <div id="stadium" class="zone stadium"></div>
          </div>

          <div id="opp-active" class="zone active"></div>
          <div id="player-active" class="zone active"></div>

          <div class="table">
            <div id="opp-table-half" class="table-half"></div>
            <div id="player-table-half" class="table-half"></div>
          </div>
        </div>

        <div id="player-field" class="field">
          <div id="player-prizes" class="zone pile prizes"></div>

          <div id="player-bench" class="zone bench"></div>

          <div class="deck-discard">
            <div id="player-deck" class="zone pile deck"></div>
            <div id="player-discard" class="zone pile discard"></div>
          </div>
        </div>
      </div>

      <div id="player-hand" class="hand">
        <div class="hand-cards"></div>
      </div>

      <div class="hud-dock">
        <button id="sidebar-toggle" class="dock-btn" data-open-tab="actions" aria-label="Actions">&#9776;</button>
      </div>
    </div>

    <div id="sidebar" class="collapsed">
      <div class="sidebar-header">
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="chat">Chat</button>
          <button class="tab-btn" data-tab="actions">Actions</button>
          <button class="tab-btn" data-tab="multiplayer">Online</button>
        </div>
        <button class="sidebar-close" id="close-sidebar" aria-label="Close">&times;</button>
      </div>

      <div id="chat-panel" class="tab-panel active">
        <div id="log-display" class="unified-output">
          <div class="log-entry system"><span class="username">[System]:</span> Sandbox room created.</div>
        </div>

        <div class="chat-input-container">
          <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
          <button id="send-btn" aria-label="Send">&#10148;</button>
        </div>
      </div>

      <div id="actions-panel" class="tab-panel">
        <div class="action-section">
          <div class="section-label">Game Actions</div>
          <div class="action-grid">
            <button class="action-btn" id="btn-shuffle-deck">Shuffle Deck</button>
            <button class="action-btn" id="btn-shuffle-discard">Shuffle Discard</button>
            <button class="action-btn" id="btn-move-deck-bottom">Move To<br />Deck Bottom</button>
            <button class="action-btn" id="btn-flip-coin">Flip Coin</button>
            <button class="action-btn" id="btn-setup">Set Up</button>
            <button class="action-btn" id="btn-mulligan">Mulligan</button>
            <button class="action-btn" id="btn-discard-hand">Discard Hand</button>
            <button class="action-btn" id="btn-show-opp-hand">Show Opponent Hand</button>
            <button class="action-btn" id="btn-hide-lost-zone">Hide Lost Zone</button>
          </div>
          <div class="btn-row">
            <button class="action-btn danger" id="btn-end-turn">End<br />Turn</button>
          </div>
          <div class="btn-row">
            <button class="action-btn" id="btn-undo">Undo</button>
            <button class="action-btn" id="btn-redo">Redo</button>
          </div>
        </div>

        <div class="action-section">
          <div class="section-label">Tokens</div>
          <div class="action-grid">
            <div class="btn-row">
              <button class="action-btn token-btn" id="gx-btn">GX</button>
              <button class="action-btn token-btn" id="vstar-btn">VSTAR</button>
            </div>
          </div>
        </div>

        <div class="action-section">
          <div class="section-label">Deck</div>
          <div class="action-grid">
            <button class="action-btn" id="btn-load-deck">Load Deck</button>
            <button class="action-btn" id="btn-load-demo-deck">Load Demo Deck</button>
            <button class="action-btn" id="btn-open-builder">Deck Builder</button>
          </div>
        </div>

        <div id="solo-actions-section" class="action-section">
          <div class="section-label">Solo Mode</div>
          <div class="action-grid">
            <button class="action-btn" id="btn-load-opp-deck">Load Opponent Deck</button>
            <button class="action-btn" id="btn-load-opp-demo-deck">Load Opponent Demo Deck</button>
            <button class="action-btn" id="btn-switch-seat">Switch Seat</button>
          </div>
        </div>

        <div class="action-section">
          <div class="section-label">Game State</div>
          <div class="action-grid">
            <button class="action-btn" id="btn-load-state">Load State</button>
            <button class="action-btn" id="btn-export-state">Export State</button>
            <button class="action-btn" id="btn-export-log">Export Log</button>
          </div>
        </div>

        <div class="action-section danger">
          <div class="section-label danger">Reset</div>
          <div class="action-grid">
            <button class="action-btn danger" id="btn-reset-board">Reset Board</button>
            <button class="action-btn danger" id="btn-reset-game">Reset Game</button>
            <button class="action-btn danger" id="btn-exit-room">Exit Room</button>
          </div>
        </div>
      </div>

      <div id="multiplayer-panel" class="tab-panel">
        <div class="mp-form">
          <div class="mp-status" id="mp-status">Not connected</div>

          <label class="mp-label" for="mp-username">Username</label>
          <input type="text" id="mp-username" class="mp-input" placeholder="Enter your name" autocomplete="off" />

          <label class="mp-label" for="mp-room">Room ID</label>
          <input type="text" id="mp-room" class="mp-input" placeholder="Enter room ID" autocomplete="off" />

          <div class="btn-row">
            <button id="mp-generate-id-btn" class="action-btn mp-generate">Generate ID</button>
            <button id="mp-join-btn" class="action-btn mp-join">Join Room</button>
          </div>
        </div>

        <div class="settings-zone">
          <div class="action-section">
            <div class="section-label">Local Settings</div>
            <div class="settings-option settings-option--select">
              <span class="settings-label">Default Tab</span>
              <select id="sidebar-tab-select" class="settings-select">
                <option value="chat">Chat</option>
                <option value="actions">Actions</option>
                <option value="multiplayer">Online</option>
              </select>
            </div>
            <div class="settings-option settings-option--select">
              <span class="settings-label">Theme</span>
              <select id="theme-select" class="settings-select">
                <option value="default">Default</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </div>
            <label class="settings-option" for="sidebar-side-switch">
              <span class="settings-label">Left-Sided Sidebar</span>
              <input id="sidebar-side-switch" type="checkbox" class="settings-checkbox" />
            </label>
          </div>
          <div class="action-section">
            <div class="section-label">Multiplayer Settings</div>
            <label class="settings-option" for="spectators-switch">
              <span class="settings-label">Allow Spectators</span>
              <input id="spectators-switch" type="checkbox" class="settings-checkbox" />
            </label>
          </div>
        </div>
      </div>
    </div>

    <div id="action-menu" class="collapsed side-panel click-handling">
      <div class="panel-header">
        <div class="panel-header-text">
          <div id="menu-card-name" class="side-panel-title"></div>
          <div class="panel-tabs">
            <button id="btn-card-controls" class="panel-tab-btn active">Controls</button>
            <button id="btn-view-attached" class="panel-tab-btn">View Attached</button>
          </div>
        </div>
        <button id="btn-action-menu-close" class="btn-side-panel-close">&times;</button>
      </div>

      <div id="card-controls-tab" class="controls-tab menu-page active">
        <div id="markers-section">
          <div class="menu-section counters">
            <div class="counter-control"><span>Dmg:</span><button id="btn-dmg-down">-</button><span id="txt-menu-dmg">0</span><button id="btn-dmg-up">+</button></div>
            <div class="counter-control"><span>Counter:</span><button id="btn-counter-down">-</button><span id="txt-menu-counter">0</span><button id="btn-counter-up">+</button></div>
          </div>
          <div class="menu-section statuses">
            <button class="status-chip" data-status="BRN">BRN</button>
            <button class="status-chip" data-status="PAR">PAR</button>
            <button class="status-chip" data-status="PSN">PSN</button>
            <button class="status-chip" data-status="FRZ">FRZ</button>
            <button class="status-chip" data-status="SLP">SLP</button>
            <button class="status-chip" data-status="CON">CON</button>
          </div>
          <div class="menu-section">
            <button id="btn-ability">Ability: Ready</button>
          </div>
        </div>

        <div id="rotation-controls" class="menu-section">
          <div class="rotation-dpad">
            <button id="btn-rotate-upright" class="dpad-btn dpad-up">&uarr;</button>
            <button id="btn-rotate-left" class="dpad-btn dpad-left">&larr;</button>
            <button id="btn-flip" class="dpad-btn dpad-center">&#x27F3;</button>
            <button id="btn-rotate-right" class="dpad-btn dpad-right">&rarr;</button>
            <button id="btn-rotate-invert" class="dpad-btn dpad-down">&darr;</button>
          </div>

          <button id="btn-rotate-break" class="break-btn">BREAK</button>
        </div>
      </div>

      <div id="view-attached-tab" class="menu-page">
        <div id="view-attached-grid" class="panel-grid"></div>
      </div>
    </div>

    <div id="pile-browser" class="collapsed side-panel click-handling">
      <div class="panel-header">
        <div class="panel-header-text">
          <div id="pile-browser-title" class="side-panel-title"></div>
          <div id="pile-browser-count" class="panel-subtext"></div>
        </div>
        <button id="btn-pile-browser-close" class="btn-side-panel-close">&times;</button>
      </div>
      <div id="pile-browser-grid" class="panel-grid"></div>
    </div>

    <div id="card-view-overlay" class="click-handling">
      <img id="card-view-img" src="" alt="" />
      <button id="btn-close-card-view" class="close-btn">&times;</button>
    </div>

    <div id="demo-deck-selector" class="click-handling">
      <div class="panel-header">
        <div class="panel-header-text">Demo Decks</div>
        <div id="btn-demo-decks-close" class="btn-side-panel-close">&times;</div>
      </div>
      <div class="demo-card-container">
        <div id="dragapult-deck" class="demo-card">
          <img src="https://limitlesstcg.nyc3.digitaloceanspaces.com/tpci/TWM/TWM_130_R_EN.png" alt="Dragapult ex" />
        </div>
      </div>
    </div>

    <script type="module" src="./js/game.js"></script>
  </body>
</html>
