<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Removed user-select=none so users can tap and copy long card image URLs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PTCG Sandbox — Deck Builder</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="deck.css" />
  </head>
  <body>
    <div id="deck-builder-view">
      <div class="deck-builder-header">
        <a href="../home/index.html" class="back-link">&larr; Back to Dashboard</a>
        <h1 id="builder-title">Deck Builder</h1>
      </div>

      <div class="builder-grid">
        <!-- Left Side Panel: Deck Configurations -->
        <div class="menu-box builder-meta">
          <h3>Deck Details</h3>
          <label for="deck-name-input">Deck Name</label>
          <input type="text" id="deck-name-input" placeholder="e.g. Charizard ex" />

          <label for="deck-cardback-input">Cardback Image URL</label>
          <input type="text" id="deck-cardback-input" placeholder="https://images.pokemontcg.io/back.png" />

          <div class="builder-stats">
            <span id="card-count-stat">0 cards</span>
          </div>

          <div class="builder-actions">
            <button id="btn-add-row" class="menu-btn secondary-btn">+ Add Blank Card</button>
            <button id="btn-save-deck-builder" class="menu-btn">Save to Library</button>
          </div>

          <div class="builder-import">
            <h4>Or import a CSV</h4>
            <input type="file" id="csv-import-input" accept=".csv,text/csv" />
            <p class="hint">Format: qty,name,type,url</p>
          </div>
        </div>

        <!-- Right Side Panel: Visual List Stack Area -->
        <div class="menu-box builder-rows full-height-box">
          <h3>Cards</h3>
          <!-- The scrollable visual container replacing the table layout -->
          <div id="rows-container" class="scroll-list visual-deck-stack"></div>
        </div>
      </div>
    </div>

    <!-- The Tap Overlay Box Layout (Accessible Native Dialog) -->
    <dialog id="card-detail-modal" class="detail-overlay-box">
      <div class="modal-content">
        <button id="modal-close-btn" class="modal-close-icon">&times;</button>

        <div class="modal-body-split">
          <!-- Visual Left Area: Dynamic Card Preview -->
          <div class="modal-preview-pane">
            <img id="modal-preview-img" src="../assets/logo.png" alt="Card Image Preview" />
          </div>

          <!-- Data Right Area: Form Editors -->
          <div class="modal-form-pane">
            <input type="hidden" id="modal-card-id" />

            <div class="modal-field">
              <label for="modal-qty-input">Quantity</label>
              <div class="qty-stepper">
                <button id="modal-qty-down" class="step-btn">−</button>
                <input type="number" id="modal-qty-input" min="0" max="59" />
                <button id="modal-qty-up" class="step-btn">+</button>
              </div>
            </div>

            <div class="modal-field">
              <label for="modal-name-input">Card Name</label>
              <input type="text" id="modal-name-input" placeholder="e.g. Pikachu" />
            </div>

            <div class="modal-field">
              <label for="modal-type-input">Card Type</label>
              <select id="modal-type-input">
                <option value="Pokémon">Pokémon</option>
                <option value="Trainer">Trainer</option>
                <option value="Energy">Energy</option>
                <option value="cardback">Cardback</option>
              </select>
            </div>

            <div class="modal-field">
              <label for="modal-url-input">Image URL</label>
              <input type="text" id="modal-url-input" placeholder="https://images.pokemontcg.io/..." />
            </div>

            <button id="modal-save-btn" class="menu-btn">Apply Changes</button>
            <button id="modal-delete-btn" class="menu-btn danger-btn">Remove Card</button>
          </div>
        </div>
      </div>
    </dialog>

    <script src="./deck.js"></script>
  </body>
</html>
