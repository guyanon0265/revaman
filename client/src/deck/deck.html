<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>RevaMan | PTCG Deck Builder</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="deck.css" />
  </head>
  <body>
    <div id="deck-builder-view">
      <main id="grid-panel" class="panel grid-panel">
        <header class="panel-heading">
          <div class="panel-heading-text">
            <h1 id="deck-name-heading">Deck</h1>
            <p id="deck-stats-line" class="panel-subtext">0 cards</p>
          </div>
        </header>
        <div id="deck-grid" class="deck-grid"></div>
      </main>

      <aside id="sidebar-panel" class="panel sidebar-panel">
        <header class="panel-heading">
          <h1>Editor</h1>
        </header>

        <div class="sidebar-preview">
          <div class="sidebar-preview-thumb" id="sidebar-preview-thumb">
            <img id="sidebar-preview-img" alt="" />
            <span id="sidebar-preview-fallback" class="thumb-fallback"></span>
          </div>
        </div>

        <div class="sidebar-fields">
          <div class="sidebar-field">
            <label for="sidebar-name-input" id="sidebar-name-label">Card Name</label>
            <input type="text" id="sidebar-name-input" placeholder="e.g. Pikachu" autocomplete="off" />
          </div>

          <div class="sidebar-field">
            <label for="sidebar-type-select">Type</label>
            <select id="sidebar-type-select">
              <option value="Pokemon">Pokemon</option>
              <option value="Trainer">Trainer</option>
              <option value="Energy">Energy</option>
            </select>
            <input type="text" id="sidebar-type-readonly" value="Cardback" disabled hidden />
          </div>

          <div class="sidebar-field">
            <label for="sidebar-qty-input">Quantity</label>
            <input type="number" id="sidebar-qty-input" min="0" max="60" value="1" />
          </div>

          <div class="sidebar-field">
            <label for="sidebar-url-input">Image URL</label>
            <input type="text" id="sidebar-url-input" placeholder="https://images.pokemontcg.io/..." autocomplete="off" />
          </div>
        </div>

        <p class="sidebar-hint">The Cardback entry is permanent and cannot be removed from the grid.</p>

        <div class="sidebar-actions">
          <div class="sidebar-actions-row">
            <button type="button" id="btn-add-card" class="menu-btn">+ Add Card</button>
            <button type="button" id="btn-remove-card" class="menu-btn danger-btn">Remove Card</button>
          </div>
          <div class="sidebar-actions-row">
            <button type="button" id="btn-load-demo-deck" class="menu-btn secondary-btn">Load Demo Deck</button>
            <button type="button" id="btn-import-text" class="menu-btn secondary-btn">Import From Text</button>
          </div>
          <div class="sidebar-actions-row">
            <button type="button" id="btn-import-csv" class="menu-btn secondary-btn">Import CSV</button>
            <button type="button" id="btn-export-csv" class="menu-btn secondary-btn">Export CSV</button>
          </div>
        </div>

        <input type="file" id="csv-file-input" accept=".csv,text/csv" hidden />
      </aside>
    </div>
    <div id="demo-deck-selector" class="modal-overlay">
      <div class="panel-header">
        <div class="panel-header-text">
          <div class="side-panel-title">Demo Decks</div>
        </div>
        <button type="button" id="btn-demo-decks-close" class="btn-side-panel-close">&times;</button>
      </div>
      <div class="demo-card-container">
        <div class="demo-card-option" data-deck-id="dragapult-deck">
          <div class="demo-card">
            <img src="https://limitlesstcg.nyc3.digitaloceanspaces.com/tpci/TWM/TWM_130_R_EN.png" alt="Dragapult ex" />
          </div>
        </div>
      </div>
    </div>
    <div id="text-import-overlay" class="modal-overlay">
      <div class="panel-header">
        <div class="panel-header-text">
          <div class="side-panel-title">Import From Text</div>
        </div>
        <button type="button" id="btn-text-import-close" class="btn-side-panel-close">&times;</button>
      </div>
      <textarea id="text-import-textarea" class="text-import-textarea" placeholder="Paste a deck list here..." spellcheck="false"></textarea>
      <button type="button" id="btn-text-import-confirm" class="menu-btn">Import</button>
    </div>

    <script type="module" src="deck.js"></script>
  </body>
</html>
