services:
  - type: web
    name: revaman
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install -g pnpm@11.12.0 && pnpm install --frozen-lockfile
    startCommand: node server/src/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_UI_USERNAME
        sync: false
      - key: ADMIN_UI_PASSWORD_HASH
        sync: false
