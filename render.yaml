services:
  - type: web
    name: revaman
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install -g pnpm@11.22.0 && pnpm install --frozen-lockfile
    startCommand: node server/src/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: CLIENT_ORIGIN
        value: https://revaman.onrender.com
      - key: ADMIN_UI_USERNAME
        sync: false
      - key: ADMIN_UI_PASSWORD_HASH
        sync: false
